<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторная работа №1 | Коцур М.Д.</title>
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;  
            background-color: #f0f4f8;
            color: #333;
            line-height: 1.6;
        }

        .header {
            background-color: #2c3e50;
            color: #ecf0f1;
            padding: 20px 30px;
            font-family: fantasy; 
            font-size: 20px;     
        }
        .header h1 {
            font-family: fantasy; 
            color: #f1c40f;
            font-size: 26px;
            margin-bottom: 8px;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            padding: 30px;
            max-width: 1100px;
            margin: 0 auto;
        }
        .canvas-section, .form-section {
            background: #fff;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }
        .canvas-section { flex: 1 1 500px; }
        .form-section { flex: 1 1 350px; }

        canvas {
            border: 2px solid #333;
            border-radius: 8px;
            display: block;
            margin: 0 auto;
            background: #fff;
        }

        .form-group {
            padding-left: 5%;
            padding-right: 5%;
            margin-bottom: 4%;
        }
        .form-group > label {
            display: block;
            font-weight: bold;
            margin-bottom: 1%;
            color: #34495e;
        }
        .form-group > select,
        .form-group > input[type="text"] {
            width: 100%;
            padding: 2% 4%;
            border: 2px solid #bdc3c7;
            border-radius: 6px;
            font-size: 15px;
            transition: border-color 0.3s;
        }
        .form-group > input[type="text"]:focus,
        .form-group > select:focus {
            border-color: #3498db;
            outline: none;
        }

        .r-buttons button:hover {
            background-color: #ecf0f1;
            border-color: #3498db;
        }
        .r-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 4%;
        }
        .r-buttons button {
            padding: 2% 4%;
            border: 2px solid #bdc3c7;
            border-radius: 6px;
            background: #fff;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: all 0.2s;
        }
        .r-buttons button.active {
            background: #3498db;
            color: #fff;
            border-color: #2980b9;
        }

        .submit-btn {
            width: 90%;
            margin-left: 5%;
            padding: 3% 0;
            background: #27ae60;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .submit-btn:hover { background: #219a52; }

     
        .results-section {
            max-width: 1100px;
            margin: 0 auto 40px;
            padding: 0 30px;
        }
        .results-table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }
        .results-table thead > tr > th {
            background: #2c3e50;
            color: #fff;
            padding: 14px;
            text-align: center;
        }
        .results-table tbody > tr:nth-child(even) {
            background: #f8f9fa;
        }
        .results-table tbody > tr > td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #ecf0f1;
        }

        .hit-yes { color: #27ae60; font-weight: bold; }
        .hit-no { color: #e74c3c; font-weight: bold; }

        .clear-btn {
            margin-top: 2%;
            padding: 2% 5%;
            background: #e74c3c;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        .clear-btn:hover { background: #c0392b; }
        .error-msg { color: #e74c3c; font-size: 13px; margin-top: 4px; min-height: 18px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Лабораторная работа №1</h1>
        <p>ФИО: Коцур Мария Дмитриевна | Группа: P3213 | Вариант: 12703</p>
    </div>

    <div class="container">
        <div class="canvas-section">
            <h2 style="margin-bottom: 15px; color: #2c3e50;">График области</h2>
            <canvas id="areaCanvas" width="500" height="500"></canvas>
        </div>

        <div class="form-section">
            <h2 style="margin-bottom: 15px; color: #2c3e50;">Ввод координат</h2>
            <form id="pointForm" novalidate>
                <div class="form-group">
                    <label for="xSelect">X:</label>
                    <select id="xSelect" name="x">
                        <option value="-2">-2</option>
                        <option value="-1.5">-1.5</option>
                        <option value="-1">-1</option>
                        <option value="-0.5">-0.5</option>
                        <option value="0" selected>0</option>
                        <option value="0.5">0.5</option>
                        <option value="1">1</option>
                        <option value="1.5">1.5</option>
                        <option value="2">2</option>
                    </select>
                    <div class="error-msg" id="xError"></div>
                </div>

                <div class="form-group">
                    <label for="yInput">Y (от -3 до 3):</label>
                    <input type="text" id="yInput" name="y" placeholder="Введите число">
                    <div class="error-msg" id="yError"></div>
                </div>

                <div class="form-group">
                    <label>R:</label>
                    <div class="r-buttons" id="rButtons">
                        <button type="button" data-r="1">1</button>
                        <button type="button" data-r="2" class="active">2</button>
                        <button type="button" data-r="3">3</button>
                        <button type="button" data-r="4">4</button>
                        <button type="button" data-r="5">5</button>
                    </div>
                    <div class="error-msg" id="rError"></div>
                </div>

                <button type="submit" class="submit-btn">Проверить</button>
            </form>
        </div>
    </div>

    <div class="results-section">
        <h2 style="margin-bottom: 15px; color: #2c3e50;">Результаты проверок</h2>
        <table class="results-table" id="resultsTable">
            <thead>
                <tr>
                    <th>X</th>
                    <th>Y</th>
                    <th>R</th>
                    <th>Попала?</th>
                    <th>Дата и время</th>
                </tr>
            </thead>
            <tbody id="resultsBody"></tbody>
        </table>
        <button class="clear-btn" id="clearBtn">Очистить результаты</button>
    </div>

    <script>
        let currentR = 2;
        const canvas = document.getElementById('areaCanvas');
        const ctx = canvas.getContext('2d');
        const form = document.getElementById('pointForm');
        const resultsBody = document.getElementById('resultsBody');
        const clearBtn = document.getElementById('clearBtn');
        const yInput = document.getElementById('yInput');
        const yError = document.getElementById('yError');
        let lastValidY = '';

        function drawArea() {
            const W = canvas.width, H = canvas.height;
            const cx = W / 2, cy = H / 2;
            const scale = Math.min(W, H) / 10; 

            ctx.clearRect(0, 0, W, H);
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, W, H);

            // Сетка
            ctx.strokeStyle = '#e0e0e0'; ctx.lineWidth = 0.5;
            for (let i = -5; i <= 5; i++) {
                ctx.beginPath(); ctx.moveTo(cx + i * scale, 0); ctx.lineTo(cx + i * scale, H); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, cy - i * scale); ctx.lineTo(W, cy - i * scale); ctx.stroke();
            }

            // Оси со стрелками
            ctx.strokeStyle = '#333'; ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(W - 15, cy); ctx.stroke(); // X
            ctx.beginPath(); ctx.moveTo(W - 15, cy); ctx.lineTo(W - 25, cy - 5); ctx.lineTo(W - 25, cy + 5); ctx.closePath(); ctx.fillStyle = '#333'; ctx.fill();
            
            ctx.beginPath(); ctx.moveTo(cx, H); ctx.lineTo(cx, 15); ctx.stroke(); // Y
            ctx.beginPath(); ctx.moveTo(cx, 15); ctx.lineTo(cx - 5, 25); ctx.lineTo(cx + 5, 25); ctx.closePath(); ctx.fill();

            ctx.font = '14px Arial'; ctx.fillStyle = '#333';
            ctx.fillText('X', W - 15, cy + 18);
            ctx.fillText('Y', cx + 10, 15);

            ctx.font = '12px Arial'; ctx.fillStyle = '#555';
            const rPx = currentR * scale;

            ctx.textAlign = 'center';
            ctx.fillText('R', cx + rPx, cy + 25);
            ctx.fillText('R/2', cx + rPx / 2, cy + 25);
            ctx.fillText('-R/2', cx - rPx / 2, cy + 25);
            ctx.fillText('-R', cx - rPx, cy + 25);

            ctx.textAlign = 'right';
            ctx.fillText('R', cx - 10, cy - rPx + 4);
            ctx.fillText('R/2', cx - 10, cy - rPx / 2 + 4);
            ctx.fillText('-R/2', cx - 10, cy + rPx / 2 + 4);
            ctx.fillText('-R', cx - 10, cy + rPx + 4);

            // Фигуры
            ctx.fillStyle = 'rgba(52, 152, 219, 0.5)';
            ctx.strokeStyle = 'rgba(41, 128, 185, 0.9)';
            ctx.lineWidth = 2;

            // Прямоугольник
            ctx.beginPath();
            ctx.rect(cx, cy - currentR * scale, (currentR / 2) * scale, currentR * scale);
            ctx.fill(); ctx.stroke();

            // Треугольник
            ctx.beginPath();
            ctx.moveTo(cx - (currentR / 2) * scale, cy);
            ctx.lineTo(cx, cy);
            ctx.lineTo(cx, cy - (currentR / 2) * scale);
            ctx.closePath();
            ctx.fill(); ctx.stroke();

            // Четверть круга
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, (currentR / 2) * scale, 0, Math.PI / 2, false);
            ctx.closePath();
            ctx.fill(); ctx.stroke();
        }

        function checkHit(x, y, r) {
            if (x >= 0 && x <= r / 2 && y >= 0 && y <= r) return true; // Прямоугольник
            if (x >= -r / 2 && x <= 0 && y >= 0 && y <= x + r / 2) return true; // Треугольник
            if (x >= 0 && y <= 0 && (x * x + y * y) <= (r / 2) * (r / 2)) return true; // Четверть круга
            return false;
        }

        function validateY(val) {
            const num = parseFloat(val);
            return !isNaN(num) && num >= -3 && num <= 3;
        }

        // R
        document.querySelectorAll('#rButtons > button').forEach(btn => {
            btn.addEventListener('click', function () {
                document.querySelectorAll('#rButtons > button').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentR = parseInt(this.dataset.r);
                drawArea();
            });
        });

        yInput.addEventListener('input', function () {
            let val = this.value;

            const isValidFormat = /^-?\d*\.?\d*$/.test(val);

            if (!isValidFormat) {
                this.value = lastValidY;
                val = lastValidY;
            } else {
                lastValidY = val;
            }

            if (val === '' || val === '-' || val === '.') {
                yError.textContent = ''; 
                return;
            }

            const num = parseFloat(val);
            if (num < -3 || num > 3) {
                yError.textContent = 'Y должен быть числом от -3 до 3';
            } else {
                yError.textContent = ''; 
            }
        });

        // Отправка формы
        form.addEventListener('submit', function (e) {
            e.preventDefault();
            const xVal = document.getElementById('xSelect').value;
            const yVal = document.getElementById('yInput').value.trim();
            const rVal = currentR;

            document.getElementById('yError').textContent = '';

            if (!validateY(yVal)) {
                document.getElementById('yError').textContent = 'Y должен быть числом от -3 до 3';
                return;
            }

            const x = parseFloat(xVal), y = parseFloat(yVal), r = rVal;
            const hit = checkHit(x, y, r);
            const now = new Date();
            
            const dateStr = now.toLocaleString('ru-RU', {
                year: 'numeric', month: '2-digit', day: '2-digit',
                hour: '2-digit', minute: '2-digit', second: '2-digit', timeZoneName: 'short'
            });

            addResult(x, y, r, hit, dateStr, now.toISOString());
            saveResults();
            drawAreaWithPoint(x, y, r, hit);
            
            yInput.value = ''; 
            lastValidY = '';
        });

        function addResult(x, y, r, hit, dateStr, isoStr) {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${x}</td>
                <td>${y}</td>
                <td>${r}</td>
                <td class="${hit ? 'hit-yes' : 'hit-no'}">${hit ? 'Да' : 'Нет'}</td>
                <td data-iso="${isoStr}">${dateStr}</td>
            `;
            resultsBody.appendChild(tr);
        }

        function drawAreaWithPoint(x, y, r, hit) {
            drawArea();
            const W = canvas.width, H = canvas.height;
            const cx = W / 2, cy = H / 2;
            const scale = Math.min(W, H) / 10;
            const px = cx + x * scale, py = cy - y * scale;

            ctx.beginPath();
            ctx.arc(px, py, 6, 0, Math.PI * 2);
            ctx.fillStyle = hit ? '#27ae60' : '#e74c3c';
            ctx.fill();
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
        }

        function saveResults() {
            const data = [];
            resultsBody.querySelectorAll('tr').forEach(row => {
                const cells = row.querySelectorAll('td');
                data.push({
                    x: cells[0].textContent, 
                    y: cells[1].textContent, 
                    r: cells[2].textContent,
                    hit: cells[3].textContent === 'Да', 
                    iso: cells[4].dataset.iso
                });
            });
            localStorage.setItem('lab1_results_kotsur', JSON.stringify(data));
        }

        function loadResults() {
            const data = localStorage.getItem('lab1_results_kotsur');
            if (!data) return;
            JSON.parse(data).forEach(item => {
                const date = new Date(item.iso);

                const dateStr = date.toLocaleString('ru-RU', {
                    year: 'numeric', month: '2-digit', day: '2-digit',
                    hour: '2-digit', minute: '2-digit', second: '2-digit', timeZoneName: 'short'
                });
                addResult(parseFloat(item.x), parseFloat(item.y), parseInt(item.r), item.hit, dateStr, item.iso);
            });
        }

        clearBtn.addEventListener('click', function () {
            if (confirm('Удалить все результаты?')) {
                resultsBody.innerHTML = '';
                localStorage.removeItem('lab1_results_kotsur');
            }
        });

        drawArea();
        loadResults();
    </script>
</body>
</html>
